# Example reverse proxy for self-hosted production.
# TLS certs: use certbot or Caddy for automatic HTTPS.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream platform_api {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
}

server {
    listen 80;
    server_name exam.localhost;

    limit_req zone=api burst=50 nodelay;
    client_max_body_size 50m;

    location /v1/sdk/ws/ {
        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://platform_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name media.localhost;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        client_max_body_size 0;
    }
}
